<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejemplo de Strong</title>
</head>
<body>
    <h1>Ejemplo de etiquetas strong</h1>

    <p>Este es un texto normal y <strong>esta parte está resaltada</strong>.</p>

    <p>
        <strong>Importante:</strong> Recuerda guardar los cambios antes de cerrar la aplicación.
    </p>

    <ul>
        <li><strong>Servidor:</strong> SRV01</li>
        <li><strong>IP:</strong> 192.168.1.10</li>
        <li><strong>Estado:</strong> Activo</li>
    </ul>

    <p>
        El usuario <strong>admin</strong> pertenece al grupo
        <strong>Administradores</strong>.
    </p>
</body>
</html>
